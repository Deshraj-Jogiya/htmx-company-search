<tr id="company-row-{{ c.id }}">
  <td>{{ c.name }}</td>
  <td>{{ c.industry }}</td>
  <td>
    <button
      type="button"
      hx-post="/companies/{{ c.id }}/toggle-sponsorship"
      hx-target="closest tr"
      hx-swap="outerHTML"
    >{{ "Yes" if c.sponsors_h1b else "No" }}</button>
  </td>
</tr>
